name: ci
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p qnx/build && make -C qnx test
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check web/server.mjs && node --check web/app.js
      - run: bash -n scripts/build-image.sh && bash -n scripts/run.sh
      - run: node --test scripts/test-run.mjs
